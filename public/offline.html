<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Field Issue Tracker — Offline Fallback</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #092B27;
        color: #F5F7F5;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: rgba(18, 61, 53, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        color: #C7D3CE;
        font-size: 14px;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        background: #16A477;
        color: #092B27;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are currently offline</h1>
      <p>
        The requested route is not in the browser cache yet, but your locally saved field reports in IndexedDB remain safe.
      </p>
      <a href="/">Return to Field Tracker</a>
    </main>
  </body>
</html>
